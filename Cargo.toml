[workspace]
members = ["crates/zipover-core", "crates/zipover-cli"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
zipover-core = { path = "crates/zipover-core" }
hex = "0.4"
png = "0.17"
rust-i18n = "4.2.4"

[patch.crates-io]
# GNOME 文件剪贴板支持（#232）在 v3.7.0 发布后合入。
# crates.io 发布包含此改动的版本后移除此补丁。
arboard = { git = "https://github.com/1Password/arboard.git", rev = "e8ccf3ec25afe3dcdf626459de33b0498ddcc3ca" }

[profile.release]
lto = "thin"
strip = true
