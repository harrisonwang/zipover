[workspace]
members = ["crates/zipover-core", "crates/zipover-cli"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
zipover-core = { path = "crates/zipover-core" }
hex = "0.4"
png = "0.17"
rust-i18n = "4.2.4"

[patch.crates-io]
# GNOME file clipboard support (#232) was merged after v3.7.0.
# Remove this patch once a crates.io release includes that change.
arboard = { git = "https://github.com/1Password/arboard.git", rev = "e8ccf3ec25afe3dcdf626459de33b0498ddcc3ca" }

[profile.release]
lto = "thin"
strip = true
