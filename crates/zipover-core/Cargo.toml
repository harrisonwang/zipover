[package]
name = "zipover-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
arboard = { version = "3", features = ["wayland-data-control"] }
bincode = "1"
getrandom = "0.3"
hex.workspace = true
hostname = "0.4"
mdns-sd = { version = "0.21", default-features = false }
png.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
spake2 = "0.4"
