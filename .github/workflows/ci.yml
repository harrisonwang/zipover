name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format and distribution checks
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          bash -n scripts/install-linux.sh
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m json.tool .github/scoop/zipover.json.tmpl > /dev/null
          sed 's/{{CLASS_NAME}}/Zipover/g' .github/homebrew/formula.rb.tmpl | ruby -c
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
